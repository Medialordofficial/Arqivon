name: arqivon
description: "Arqivon – The Living Lens. A real-time multimodal Live Agent."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Networking
  web_socket_channel: ^3.0.3

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  firebase_storage: ^12.4.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # Camera & Media
  camera: ^0.10.5+9
  permission_handler: ^11.2.0

  # Audio
  record: ^6.2.0
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # UI
  intl: ^0.19.0
  flutter_animate: ^4.5.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  path_provider: ^2.1.2

  # PDF & Share
  pdf: ^3.11.1
  share_plus: ^10.1.4

  # Actions & Integrations
  url_launcher: ^6.2.5

  # Connectivity
  connectivity_plus: ^6.0.3

  # Crashlytics
  firebase_crashlytics: ^4.3.2

  # Logging
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
